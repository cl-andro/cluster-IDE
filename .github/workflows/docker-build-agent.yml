name: Docker - Build Agent Images

on:
  workflow_dispatch:
    inputs:
      push:
        type: boolean
        description: Push images to ghcr.io
        default: true

permissions: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        tag:
          - focal-x64
          - focal-arm64
        include:
          - tag: focal-x64
            platform: linux/amd64
          - tag: focal-arm64
            platform: linux/arm64/v8
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SHOULD_PUSH: ${{ github.event.inputs.push == 'true' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@5927c834f5b4fdf503fca6f4c7eccda82949e1ee # v3.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: docker/clusteride-build-agent
          platforms: ${{ matrix.platform }}
          tags: ghcr.io/cl-andro/clusteride-build-agent:${{ matrix.tag }}
          push: ${{ env.SHOULD_PUSH == 'true' }}
