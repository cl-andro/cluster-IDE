name: Release - All Platforms

on:
  workflow_dispatch:
    inputs:
      quality:
        type: choice
        description: Release quality
        options:
          - stable
          - insider
        default: stable

jobs:
  trigger:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger release on all platforms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUALITY: ${{ github.event.inputs.quality }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          for platform in linux macos windows; do
            workflow="publish-${QUALITY}-${platform}.yml"
            echo "Triggering $workflow on ref $REF_NAME..."
            gh workflow run "$workflow" --ref "$REF_NAME"
          done
